<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin console — Grievance Desk</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="nav-root"></div>
  <div class="container">
    <h1 class="page-title">Grievance Officer console</h1>
    <p class="page-subtitle">Manage every grievance, assign Grievance Resolvers, and review analytics.</p>

    <div class="grid stats" id="stats"></div>

    <div class="grid two mt-3">
      <div class="card">
        <h3>Status distribution</h3>
        <canvas id="chart-status" height="200"></canvas>
      </div>
      <div class="card">
        <h3>Grievances per category</h3>
        <canvas id="chart-category" height="200"></canvas>
      </div>
    </div>

    <h2 class="mt-3">Grievances</h2>
    <div class="card mb-2">
      <form id="filter-form" class="flex wrap" style="gap:10px;">
        <input name="q" placeholder="Search title/description…" style="min-width:200px;" />
        <select name="status">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="in_progress">In progress</option>
          <option value="awaiting_input">Awaiting input</option>
          <option value="resolved">Resolved</option>
          <option value="rejected">Rejected</option>
        </select>
        <select name="category" id="filter-category"><option value="">All categories</option></select>
        <select name="priority">
          <option value="">All priorities</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="urgent">Urgent</option>
        </select>
        <input name="from" type="date" />
        <input name="to" type="date" />
        <button class="btn small" type="submit">Apply</button>
        <a class="btn small outline" id="export-btn" href="#">Export CSV</a>
      </form>
    </div>

    <div class="card">
      <div id="list"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
